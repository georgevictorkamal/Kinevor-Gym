name: kinevor-demo

# Local, self-contained demo stack. Every service keeps its own container,
# port, SQLite file and configuration; nothing is orchestrated between them.
#
#   docker compose -f deploy/demo/docker-compose.yml up --build
#
# Building all nineteen images takes a while. To start only the public site
# and the members showcase:
#
#   docker compose -f deploy/demo/docker-compose.yml up --build \
#     kinevor-public-site-api kinevor-public-site-web \
#     kinevor-members-api kinevor-members-web

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Demo
  ASPNETCORE_URLS: http://+:8080

x-api-build: &api-build
  context: ../..
  dockerfile: deploy/demo/Dockerfile.api

x-web-build: &web-build
  context: ../..
  dockerfile: deploy/demo/Dockerfile.web

services:
  kinevor-trainers-api:
    build:
      <<: *api-build
      args:
        SERVICE: kinevor-trainers
    environment:
      <<: *api-environment
      ConnectionStrings__Trainers: Data Source=/data/trainers-demo.db
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://127.0.0.1:4200
    ports:
      - "5081:8080"
    volumes:
      - trainers-data:/data
    restart: unless-stopped

  kinevor-trainers-web:
    build:
      <<: *web-build
      args:
        SERVICE: kinevor-trainers
    depends_on:
      - kinevor-trainers-api
    ports:
      - "4200:80"
    restart: unless-stopped

  kinevor-identity-access-api:
