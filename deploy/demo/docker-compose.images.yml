  kinevor-public-site-api:
    image: ghcr.io/georgevictorkamal/kinevor-public-site-api:${KINEVOR_VERSION:-latest}
  kinevor-public-site-web:
    image: ghcr.io/georgevictorkamal/kinevor-public-site-web:${KINEVOR_VERSION:-latest}
