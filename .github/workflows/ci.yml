name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify architecture, versions and release guardrails
        run: node scripts/verify-repo.mjs

  platform-backend:
    name: Platform · backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kinevor-platform/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Kinevor.Platform.slnx --locked-mode
      - name: Build
        run: dotnet build Kinevor.Platform.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Kinevor.Platform.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - name: Pack
        run: dotnet pack Kinevor.Platform.slnx -c Release --no-build -o artifacts/packages
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: platform-nuget
          path: |
            kinevor-platform/backend/artifacts/packages/*.nupkg
            kinevor-platform/backend/artifacts/packages/*.snupkg
          retention-days: 1
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-platform
          path: kinevor-platform/backend/artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  platform-web:
    name: Platform · web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kinevor-platform/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kinevor-platform/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Angular package
        uses: actions/upload-artifact@v7
        with:
          name: platform-web
          path: kinevor-platform/web/dist/kinevor-platform-web
          retention-days: 1

  module-backend:
    name: Backend · ${{ matrix.service }}
    needs: platform-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - kinevor-identity-access
          - kinevor-members
          - kinevor-memberships
          - kinevor-classes-bookings
          - kinevor-checkins-access
          - kinevor-payments-billing
          - kinevor-notifications
          - kinevor-trainers
          - kinevor-staff-dashboard
          - kinevor-public-site
    defaults:
      run:
        working-directory: ${{ matrix.service }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore platform package feed
        uses: actions/download-artifact@v8
        with:
          name: platform-nuget
          path: kinevor-platform/backend/artifacts/packages
      # Module projects consume locally rebuilt platform packages, whose
      # content hashes are not byte-deterministic. Committed module lockfiles
      # would fail NU1403 hash validation, so re-evaluate them on every build.
      # The platform restore above remains --locked-mode.
      - name: Restore
        run: dotnet restore *.slnx --force-evaluate
      - name: Build
        run: dotnet build *.slnx -c Release --no-restore
      - name: Test
        run: dotnet test *.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/backend/artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  module-web:
    name: Web · ${{ matrix.service }}
    needs: platform-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - kinevor-identity-access
          - kinevor-members
          - kinevor-memberships
          - kinevor-classes-bookings
          - kinevor-checkins-access
          - kinevor-payments-billing
          - kinevor-trainers
          - kinevor-staff-dashboard
          - kinevor-public-site
    defaults:
      run:
        working-directory: ${{ matrix.service }}/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore platform Angular package
        uses: actions/download-artifact@v8
        with:
          name: platform-web
          path: kinevor-platform/web/dist/kinevor-platform-web
      - name: Install with local platform binding
        run: npm run install:local -- --ci
      - name: Test
        run: npm test
      - name: Build library and demo
        run: npm run build:all

  module-mobile:
    name: Mobile · ${{ matrix.package }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kinevor-identity-access
            package: kinevor_identity_access
          - service: kinevor-members
            package: kinevor_members
          - service: kinevor-memberships
            package: kinevor_memberships
          - service: kinevor-classes-bookings
            package: kinevor_classes_bookings
          - service: kinevor-checkins-access
            package: kinevor_checkins_access
          - service: kinevor-payments-billing
            package: kinevor_payments_billing
          - service: kinevor-notifications
            package: kinevor_notifications
          - service: kinevor-trainers
            package: kinevor_trainers
          - service: kinevor-staff-dashboard
            package: kinevor_staff_dashboard
    defaults:
      run:
        working-directory: ${{ matrix.service }}/mobile/packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Install
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  e2e:
    name: E2E · public site and members
    needs: [platform-backend, platform-web]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kinevor-public-site/web/package-lock.json
            kinevor-members/web/package-lock.json
      - name: Restore platform NuGet feed
        uses: actions/download-artifact@v8
        with:
          name: platform-nuget
          path: kinevor-platform/backend/artifacts/packages
      - name: Restore platform Angular package
        uses: actions/download-artifact@v8
        with:
          name: platform-web
          path: kinevor-platform/web/dist/kinevor-platform-web
      - name: Install root tooling
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install public-site web
        working-directory: kinevor-public-site/web
        run: npm run install:local -- --ci
      - name: Install members web
        working-directory: kinevor-members/web
        run: npm run install:local -- --ci
      - name: Build public-site backend
        run: dotnet build kinevor-public-site/backend/Kinevor.Modules.PublicSite.slnx -c Release -p:RestoreForceEvaluate=true
      - name: Build public-site web
        working-directory: kinevor-public-site/web
        run: npm run build:demo
      - name: Build members backend
        run: dotnet build kinevor-members/backend/Kinevor.Modules.Members.slnx -c Release -p:RestoreForceEvaluate=true
      - name: Build members web
        working-directory: kinevor-members/web
        run: npm run build:demo
      - name: Run Playwright
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  ci-success:
    name: CI success
    if: always()
    needs:
      - hygiene
      - platform-backend
      - platform-web
      - module-backend
      - module-web
      - module-mobile
      - e2e
      - dependency-review
      - scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '(failure|cancelled)'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
