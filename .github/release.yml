# Groups auto-generated GitHub release notes by label. Used when you click
# "Generate release notes" on a release or run `gh release create --generate-notes`.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: "Security"
      labels:
        - security
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Fixes"
      labels:
        - bug
    - title: "Documentation"
      labels:
        - documentation
    - title: "Tests"
      labels:
        - tests
    - title: "Maintenance"
      labels:
        - dependencies
        - chore
        - ci
    - title: "Other changes"
      labels:
        - "*"
