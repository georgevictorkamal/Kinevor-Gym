version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/kinevor-*/backend/src/*"
      - "/kinevor-*/backend/tests/*"
      - "/kinevor-*/backend/samples/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ["*"]

  # Module web workspaces are updated together with the platform. Dependabot
  # cannot fetch their `file:../../kinevor-platform/web/dist/...` dependency,
  # so scanning them would fail the whole npm update job.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/kinevor-platform/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/deploy/demo"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "pub"
    directories:
      - "/kinevor-*/mobile/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
